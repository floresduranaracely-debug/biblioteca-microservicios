spring.application.name=ms-prestamo

server.port=8087

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/biblioteca_db
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/biblioteca
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/biblioteca/protocol/openid-connect/certs

libro.service.url=http://ms-libro:8085